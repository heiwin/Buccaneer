name: Release
on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high || true

      - uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "0.9.5"
          releaseBody: |
            ## Buccaneer ${{ github.ref_name }}

            ### Security & Stability
            - **VLC auth fix** — re-embedded credentials in stream URL to fix VLC auth prompt loop
            - **Tightened Content-Security-Policy** — hardened security by removing unnecessary connect-src origin
            - **TMDB cache bounded** — 200-entry LRU eviction cap
            - **Streaming race condition fixed** — synchronous close prevents crashes on rapid start/stop

            ### Quality-of-Life
            - **Notification bell** — bell icon on HomePage shows new episodes for favorited TV series; click navigates to the show
            - **EZTV auto-routing** — episode searches from TV detail pages transparently use EZTV for accurate results, with automatic fallback to Knaben/APIBay
            - **Source selector on DetailPage** — dropdown to switch search source (Knaben/APIBay/YTS/EZTV) directly from the torrent list
            - **Episode-aware filtering** — season/episode pattern (s##e##) extracted from queries and applied across all search sources
            - **Filters always visible** — quality/language/source filters remain visible even when no results are returned
            - **Accurate download speed** — fixed bytes/s conversion (was using wrong multiplier)
            - **Inline placeholder images** — external placehold.co replaced with SVG data URIs (works offline)
            - **ConfirmDialogs repositioned** — moved outside scrollable sections to prevent visual overlap
            - **Dynamic streaming region** — watch region loaded from settings instead of hardcoded `'IT'`

            ### Bug Fixes
            - **EZTV full pagination** — all EZTV result pages now fetched (previously capped at 3 pages), covering the entire show catalog
            - **formatBytes overflow** — clamped to prevent display corruption on extreme values
            - **VLC `--meta-title` argument** — fixed single-arg format
            - **Deep link throttle** — 1s rate limit prevents rapid duplicate navigation
            - Various minor fixes (StrictMode init, provider ID constants, modal overflow toggle, debounce cleanup, redundant imports, state catch-all, bounds validation)

            Download the appropriate asset for your platform:
            - **macOS (Intel)**: `.dmg` (x86_64)
            - **macOS (Apple Silicon)**: `.dmg` (aarch64)
            - **Windows**: `.msi`
            - **Linux**: `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
