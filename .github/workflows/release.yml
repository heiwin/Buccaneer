name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v2
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Buccaneer ${{ github.ref_name }}
          releaseBody: |
            ## Buccaneer ${{ github.ref_name }}

            Download the appropriate asset for your platform:
            - **macOS**: `.dmg`
            - **Windows**: `.msi`
            - **Linux**: `.AppImage`
          releaseDraft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
